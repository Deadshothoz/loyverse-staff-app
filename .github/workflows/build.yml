name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Lets the build publish the APK to the Releases page.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # The signing key is kept as a repository secret (KEYSTORE_BASE64),
      # not in the code. Using the same key for every build is what lets a
      # new version install over the old one without uninstalling.
      - name: Use the fixed signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p signing
            echo "$KEYSTORE_BASE64" | base64 --decode --ignore-garbage > signing/debug.keystore
            echo "Fixed signing key in place."
          else
            echo "::warning::The KEYSTORE_BASE64 secret is not set. This build is signed with a throwaway key and cannot update an installed app."
          fi

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Puts the newest APK on the Releases page, where it can be
      # downloaded from any browser without signing in to GitHub:
      # https://github.com/<owner>/<repo>/releases/latest/download/app-debug.apk
      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Latest build" --notes "Always the newest build of the app."
          gh release upload latest app/build/outputs/apk/debug/app-debug.apk --clobber
